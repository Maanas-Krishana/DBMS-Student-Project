<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <h1>Student Management System</h1>
        <p>Database Connectivity Dashboard</p>
      </header>

      <main>
        <section class="glass-card">
          <h2>Student Course Enrollments</h2>
          <button id="btn-fetch-courses" class="btn-primary">Fetch Enrollments</button>
          <div class="table-container">
            <table id="courses-table">
              <thead>
                <tr>
                  <th>Enrollment ID</th>
                  <th>Student Name</th>
                  <th>Course Name</th>
                  <th>Semester</th>
                </tr>
              </thead>
              <tbody id="courses-body">
                <!-- Data will be populated here -->
              </tbody>
            </table>
          </div>
        </section>

        <section class="glass-card">
          <h2>Generate Student Result</h2>
          <div class="input-group">
            <input type="number" id="input-student-id" placeholder="Enter Student ID (e.g. 1)" />
            <button id="btn-fetch-result" class="btn-secondary">Get Result</button>
          </div>
          <div id="result-display" class="result-box hidden">
            <!-- Data will be populated here -->
          </div>
        </section>

        <section class="glass-card">
          <h2>Add New Student</h2>
          <form id="add-student-form" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="input-group" style="margin-bottom: 0;">
              <input type="number" id="new-student-id" placeholder="Student ID (e.g. 19)" required />
            </div>
            <div class="input-group" style="margin-bottom: 0;">
              <input type="text" id="new-student-name" placeholder="Student Name" required />
            </div>
            <div class="input-group" style="margin-bottom: 0;">
              <input type="text" id="new-student-dept" placeholder="Department (e.g. CSE)" required />
            </div>
            <button type="submit" class="btn-primary" style="align-self: flex-start;">Add Student</button>
          </form>
          <div id="add-student-msg" style="margin-top: 1rem; color: #10b981;"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
